    <!-- Automatic Service Worker Registration & Background Cache Invalidation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('[PWA] ServiceWorker registered:', registration.scope);

              // Check for SW updates every 15 minutes in background
              setInterval(() => {
                registration.update();
              }, 15 * 60 * 1000);

              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version detected. Purging background cache and auto-reloading...');
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            })
            .catch(err => console.log('[PWA] ServiceWorker registration failed:', err));

          // Auto reload client when new ServiceWorker activates
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              console.log('[PWA] Controller changed. Reloading window with latest assets...');
              window.location.reload();
            }
          });
        });
      }
    </script>

    <!-- Netlify Badge Purger Script -->
    <script>
      (function() {
        const purgeNetlifyBadge = () => {
          document.querySelectorAll('netlify-badge, .netlify-badge, [data-netlify-deploy-id], iframe[src*="netlify"]').forEach(el => el.remove());
          document.querySelectorAll('div, button, a, span').forEach(el => {
            if (el.children.length === 0 && el.textContent && el.textContent.includes('Powered by Netlify')) {
              const badgeParent = el.closest('div[style*="fixed"]') || el.closest('div[style*="absolute"]') || el.parentElement || el;
              badgeParent.remove();
            }
          });
        };
        const obs = new MutationObserver(purgeNetlifyBadge);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', purgeNetlifyBadge);
        window.addEventListener('load', purgeNetlifyBadge);
        setTimeout(purgeNetlifyBadge, 1000);
        setTimeout(purgeNetlifyBadge, 3000);
      })();
    </script>
