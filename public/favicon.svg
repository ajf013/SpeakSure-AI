<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Wave/Mic Glowing Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#rimGrad)" stroke-width="6" stroke-opacity="0.8" />

  <!-- Background Soundwave Lines -->
  <path d="M 40 256 Q 90 180, 140 256 T 240 256 T 340 256 T 472 256" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" fill="none" />
  <path d="M 40 256 Q 100 320, 160 256 T 280 256 T 400 256 T 472 256" stroke="url(#rimGrad)" stroke-width="3" stroke-opacity="0.3" fill="none" />

  <!-- Central Glowing Microphone Symbol -->
  <g filter="url(#neonGlow)">
    <!-- Capsule Outer Line -->
    <rect x="216" y="140" width="80" height="150" rx="40" stroke="url(#glowGrad)" stroke-width="14" fill="none" />
    <line x1="216" y1="215" x2="296" y2="215" stroke="url(#glowGrad)" stroke-width="10" />

    <!-- Mic Base Arc -->
    <path d="M 176 220 A 80 80 0 0 0 336 220" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Mic Stem & Stand -->
    <line x1="256" y1="300" x2="256" y2="355" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />
    <line x1="206" y1="355" x2="306" y2="355" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>